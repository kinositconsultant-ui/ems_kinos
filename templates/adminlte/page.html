{% extends "adminlte/master.html" %}
{% load adminlte %}

{% block content_header %}
    <div class="app-content-header {{ adminlte.classes_content_header }}">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-sm-6">
                    <h3 class="mb-0">{% block page_title %}{% endblock %}</h3>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-end mb-0">
                        {% block breadcrumb %}{% adminlte_breadcrumb %}{% endblock %}
                    </ol>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
